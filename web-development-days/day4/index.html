<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Note Draft Pad</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Note Draft Pad</h1>
      <button type="button" id="theme-toggle">Dark mode</button>
    </header>

    <main>
      <section>
        <label for="note-text">Your note</label>
        <textarea id="note-text" rows="8" placeholder="Start typing..."></textarea>

        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>

        <button type="button" id="clear-btn">Clear</button>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 QuickNotes. Built during Web Foundations.</p>
    </footer>
  </body>
</html>
